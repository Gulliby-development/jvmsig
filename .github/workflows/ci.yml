name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # the scaffold has no Gradle wrapper, so setup-gradle installs the version the project was built with
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      # replace with the README's own command; a block scalar and bash keep the step portable across the three runners
      - name: Check
        shell: bash
        run: |
          gradle --console=plain check
